[program:openhpc-web]
command=/opt/openhpc-web/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 6827
directory=/opt/openhpc-web
user=root
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/openhpc-web/access.log
stderr_logfile=/var/log/openhpc-web/error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=PATH="/opt/openhpc-web/.venv/bin:%(ENV_PATH)s"
