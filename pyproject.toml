[project]
name = "openhpc_webui"
dynamic = ["version"]
description = "openhpc_webui"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.128.0,<0.129",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1,<0.29",
    "ldap3>=2.9.1",
    "python-dotenv>=1.2.1",
]

[project.scripts]
openhpc_webui = "openhpc_webui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhpc_webui"]

[tool.hatch.version]
path = "openhpc_webui/__about__.py"

[tool.hatch.build.targets.wheel.force-include]
"static" = "openhpc_webui/static"
"templates" = "openhpc_webui/templates"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
