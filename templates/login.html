        <style>
            :root {
                --tech-red: #dc3023;
                --sky-blue-top: #0ea5e9;
                --sky-blue-bottom: #e0f2fe;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
                height: 100vh;
                overflow: hidden;
                background: linear-gradient(
                    180deg,
                    var(--sky-blue-top) 0%,
                    var(--sky-blue-bottom) 100%
                );
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* ================= 背景层 ================= */
            .background-elements {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                pointer-events: none;
            }

            /* ================= 飞机 ================= */
            .airplane {
                position: absolute;
                opacity: 0.85;
                filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.12));
            }

            /* 大飞机（远景慢） */
            .plane-large {
                width: 140px;
                top: 22%;
                left: -200px;
                animation: flightLarge 38s linear infinite;
            }

            /* 主视觉飞机 */
            .plane-small {
                width: 100px;
                top: 45%;
                left: -150px;
                animation: flightSmall 26s linear infinite;
            }

            /* 战机（快） */
            .plane-fighter {
                width: 80px;
                top: 70%;
                left: -120px;
                opacity: 0.6;
                animation: flightFast 18s linear infinite;
            }

            /* ================= 火箭 ================= */
            .rocket {
                position: absolute;
                width: 60px;
                bottom: -150px;
                left: 15%;
                opacity: 0.9;
                animation: rocketLaunch 20s ease-in infinite;
            }

            .flame {
                animation: flameFlicker 0.15s infinite alternate;
            }

            /* ================= 气流线 ================= */
            .stream-line {
                position: absolute;
                height: 2px;
                background: rgba(255, 255, 255, 0.4);
                border-radius: 2px;
                animation: flow linear infinite;
            }

            @keyframes flow {
                from {
                    transform: translateX(120vw);
                    opacity: 0;
                }
                50% {
                    opacity: 1;
                }
                to {
                    transform: translateX(-20vw);
                    opacity: 0;
                }
            }

            /* ================= 飞行动画 ================= */
            @keyframes flightLarge {
                0% {
                    transform: translateX(0) translateY(0) rotate(1deg);
                }
                25% {
                    transform: translateX(30vw) translateY(-30px) rotate(-1deg);
                }
                50% {
                    transform: translateX(60vw) translateY(10px) rotate(0deg);
                }
                75% {
                    transform: translateX(90vw) translateY(-20px) rotate(1deg);
                }
                100% {
                    transform: translateX(130vw) translateY(0) rotate(2deg);
                }
            }

            @keyframes flightSmall {
                0% {
                    transform: translateX(0) translateY(0) rotate(2deg);
                }
                20% {
                    transform: translateX(20vw) translateY(-25px) rotate(0deg);
                }
                40% {
                    transform: translateX(45vw) translateY(15px) rotate(-2deg);
                }
                60% {
                    transform: translateX(70vw) translateY(-10px) rotate(1deg);
                }
                80% {
                    transform: translateX(95vw) translateY(10px) rotate(0deg);
                }
                100% {
                    transform: translateX(130vw) translateY(0) rotate(2deg);
                }
            }

            @keyframes flightFast {
                0% {
                    transform: translateX(0) translateY(0) rotate(3deg);
                }
                50% {
                    transform: translateX(65vw) translateY(-40px) rotate(-3deg);
                }
                100% {
                    transform: translateX(130vw) translateY(0) rotate(2deg);
                }
            }

            /* ================= 火箭动画 ================= */
            @keyframes rocketLaunch {
                0% {
                    transform: translateY(0) rotate(-5deg);
                    opacity: 0;
                }
                10% {
                    opacity: 1;
                }
                50% {
                    transform: translateY(-60vh) rotate(0deg);
                }
                100% {
                    transform: translateY(-120vh) rotate(5deg);
                    opacity: 0;
                }
            }

            @keyframes flameFlicker {
                from {
                    transform: scaleY(1);
                    opacity: 0.9;
                }
                to {
                    transform: scaleY(1.4);
                    opacity: 0.6;
                }
            }

            /* ================= 登录卡片 ================= */
            .login-card {
                position: relative;
                z-index: 10;
                width: 380px;
                padding: 40px;
                background: rgba(255, 255, 255, 0.92);
                border-radius: 8px;
                box-shadow: 0 15px 35px rgba(0, 70, 120, 0.15);
                border: 1px solid rgba(255, 255, 255, 0.5);
                text-align: center;
            }

            .title {
                font-size: 24px;
                font-weight: bold;
                color: var(--tech-red);
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 12px;
                color: #64748b;
                letter-spacing: 2px;
                margin-bottom: 30px;
            }

            .form-group {
                margin-bottom: 20px;
                text-align: left;
            }

            .input-field {
                width: 100%;
                padding: 12px;
                border: 1px solid #cbd5e1;
                border-radius: 4px;
                outline: none;
                transition: 0.3s;
            }
            .input-field:focus {
                border-color: var(--tech-red);
                box-shadow: 0 0 0 2px rgba(220, 48, 35, 0.1);
            }

            .login-button {
                width: 100%;
                padding: 12px;
                background: var(--tech-red);
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
            }
            .login-button:hover {
                background: #b91c1c;
            }

            .error-message {
                display: none;
                color: var(--tech-red);
                font-size: 13px;
                background: #fff1f0;
                padding: 10px;
                margin-bottom: 15px;
                border: 1px solid #ffa39e;
            }
            .error-message.show {
                display: block;
            }
        </style>
    </head>

        <!-- ================= 登录框 ================= -->
        <div class="login-card">
            <div class="title">智算中心管理门户</div>
            <div class="subtitle">科研报国·HPC 建设赋能中国式现代化</div>

            <form id="loginForm">
                <div id="errorMessage" class="error-message">
                    <span id="errorText"></span>
                </div>
                <div class="form-group">
                    <input
                        type="text"
                        id="username"
                        class="input-field"
                        placeholder="LDAP 用户名"
                        required
                    />
                </div>
                <div class="form-group">
                    <input
                        type="password"
                        id="password"
                        class="input-field"
                        placeholder="密码"
                        required
                    />
                </div>
                <button type="submit" id="loginButton" class="login-button">
                    <span id="buttonText">登 录</span>
                </button>
            </form>
        </div>

        <script>
            /* 生成气流线 */
            var bgLayer = document.getElementById("bgLayer");
            for (var i = 0; i < 20; i++) {
                var line = document.createElement("div");
                line.className = "stream-line";
                line.style.width = Math.random() * 120 + 80 + "px";
                line.style.top = Math.random() * 100 + "%";
                line.style.animationDuration = 6 + Math.random() * 6 + "s";
                line.style.animationDelay = Math.random() * 10 + "s";
                line.style.opacity = Math.random() * 0.4;
                bgLayer.appendChild(line);
            }

            /* 登录逻辑 */
            var loginForm = document.getElementById("loginForm");
            var loginButton = document.getElementById("loginButton");
            var buttonText = document.getElementById("buttonText");
            var lockCountdownTimer = null;

            function startLockCountdown(seconds) {
                var remaining = Math.max(1, Number(seconds) || 1);
                clearInterval(lockCountdownTimer);
                loginButton.disabled = true;

                function renderCountdown() {
                    var minutes = Math.floor(remaining / 60);
                    var secs = String(remaining % 60).padStart(2, "0");
                    document.getElementById("errorText").textContent =
                        "登录失败次数过多，请在 " + minutes + ":" + secs + " 后重试";
                    document.getElementById("errorMessage").classList.add("show");
                    buttonText.textContent = "账户已锁定";
                    if (remaining <= 0) {
                        clearInterval(lockCountdownTimer);
                        loginButton.disabled = false;
                        buttonText.textContent = "登 录";
                        return;
                    }
                    remaining -= 1;
                }

                renderCountdown();
                lockCountdownTimer = setInterval(renderCountdown, 1000);
            }

            loginForm.addEventListener("submit", function (e) {
                e.preventDefault();
                var username = document.getElementById("username").value;
                var password = document.getElementById("password").value;

                document
                    .getElementById("errorMessage")
                    .classList.remove("show");
                loginButton.disabled = true;
                buttonText.textContent = "验证中...";

                fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                    }),
                })
                    .then(function (r) {
                        return r.json().then(function (d) {
                            return {
                                ok: r.ok,
                                status: r.status,
                                retryAfter: r.headers.get("Retry-After"),
                                data: d,
                            };
                        });
                    })
                    .then(function (result) {
                        if (result.ok) {
                            buttonText.textContent = "登录成功";
                            setTimeout(function () {
                                window.location.href = "/";
                            }, 500);
                        } else {
                            document.getElementById("password").value = "";
                            if (result.status === 429 && result.retryAfter) {
                                startLockCountdown(result.retryAfter);
                                return;
                            }
                            document.getElementById("errorText").textContent =
                                result.data.detail || "登录失败";
                            document
                                .getElementById("errorMessage")
                                .classList.add("show");
                            loginButton.disabled = false;
                            buttonText.textContent = "登 录";
                        }
                    })
                    .catch(function () {
                        document.getElementById("errorText").textContent =
                            "网络错误";
                        document
                            .getElementById("errorMessage")
                            .classList.add("show");
                        loginButton.disabled = false;
                        buttonText.textContent = "登 录";
                    });
            });
        </script>
    </body>
