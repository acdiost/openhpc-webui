[program:openhpc_webui]
command=/opt/openhpc_webui/.venv/bin/uvicorn openhpc_webui.application:app --host 127.0.0.1 --port 6827 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/opt/openhpc_webui
user=root
umask=027
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/var/log/openhpc_webui/access.log
stderr_logfile=/var/log/openhpc_webui/error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=PATH="/opt/openhpc_webui/.venv/bin:%(ENV_PATH)s",PYTHONUNBUFFERED="1"
