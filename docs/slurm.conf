# ============================================================
# Generic Slurm Configuration Example
# Suitable for small/medium HPC & GPU clusters
# ============================================================

# ------------------------------------------------------------
# Cluster basic settings
# ------------------------------------------------------------
ClusterName=cluster
SlurmctldHost=localhost

SlurmUser=slurm

SlurmctldPort=6817
SlurmdPort=6818

SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

# ------------------------------------------------------------
# Authentication
# ------------------------------------------------------------
AuthType=auth/munge
CredType=cred/munge

# Optional: JWT authentication for slurmrestd
# AuthAltTypes=auth/jwt
# AuthAltParameters=jwt_key=/var/spool/slurm/statesave/jwt_hs256.key,max_token_lifespan=1800

# ------------------------------------------------------------
# Configless
# ------------------------------------------------------------
# Allows compute nodes to obtain configuration from slurmctld
SlurmctldParameters=enable_configless

# ------------------------------------------------------------
# Process tracking / cgroup
# ------------------------------------------------------------
ProctrackType=proctrack/cgroup
TaskPlugin=task/affinity,task/cgroup

# Improve job process containment
PrologFlags=Contain

# ------------------------------------------------------------
# Resource selection / scheduling
# ------------------------------------------------------------
SelectType=select/cons_tres

# Track both CPU cores and memory as consumable resources
SelectTypeParameters=CR_Core_Memory
SchedulerType=sched/backfill

# ------------------------------------------------------------
# GPU / GRES
# ------------------------------------------------------------
GresTypes=gpu

# Enable GPU accounting
AccountingStorageTRES=gres/gpu

# ------------------------------------------------------------
# Job accounting
# ------------------------------------------------------------
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30

# Disable periodic node accounting collection
AcctGatherNodeFreq=0

# ------------------------------------------------------------
# SlurmDBD accounting
# ------------------------------------------------------------
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost

# Enforce account associations, limits and QoS
AccountingStorageEnforce=associations,limits,qos

# Save job comments to accounting database
AccountingStoreFlags=job_comment

# Optional privacy settings
# PrivateData=accounts,reservations,usage,jobs,users

# ------------------------------------------------------------
# Job completion database
# ------------------------------------------------------------
# Optional:
# Use only if you need an additional job completion database.
# SlurmDBD accounting is generally preferred for full accounting.
#
# JobCompType=jobcomp/mysql
# JobCompHost=localhost
# JobCompPort=3306
# JobCompUser=slurm
# JobCompPass=CHANGE_ME
# JobCompLoc=slurm_jobcomp_db

# ------------------------------------------------------------
# Job submission
# ------------------------------------------------------------
# Optional Lua job submit plugin
# JobSubmitPlugins=lua

LaunchParameters=use_interactive_step

# ------------------------------------------------------------
# Resource limits
# ------------------------------------------------------------
PropagateResourceLimitsExcept=MEMLOCK

# ------------------------------------------------------------
# Node recovery
# ------------------------------------------------------------
# Automatically return healthy nodes to service
ReturnToService=2

# ------------------------------------------------------------
# Timeouts
# ------------------------------------------------------------
InactiveLimit=0
KillWait=30
MinJobAge=300

SlurmctldTimeout=300
SlurmdTimeout=300

Waittime=0

# ------------------------------------------------------------
# Job limits
# ------------------------------------------------------------
MaxArraySize=100000
MaxJobCount=100000

# ------------------------------------------------------------
# Preemption
# ------------------------------------------------------------
PreemptMode=OFF
PreemptType=preempt/none

# ------------------------------------------------------------
# Priority
# ------------------------------------------------------------
PriorityType=priority/multifactor
PriorityDecayHalfLife=0
PriorityUsageResetPeriod=NONE
PriorityWeightAge=100000
PriorityWeightFairshare=0
PriorityWeightJobSize=0
PriorityWeightPartition=0
PriorityWeightQOS=0
PriorityMaxAge=7-0

# ------------------------------------------------------------
# Optional health check
# ------------------------------------------------------------
# Install and configure NHC before enabling.
#
# HealthCheckProgram=/usr/sbin/nhc
# HealthCheckInterval=300

# ------------------------------------------------------------
# Optional Epilog
# ------------------------------------------------------------
# Run a cleanup script after each job.
#
# Epilog=/etc/slurm/slurm.epilog.clean

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log

SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# ------------------------------------------------------------
# Mail
# ------------------------------------------------------------
# Disable mail notifications by default
MailProg=/bin/true

# ------------------------------------------------------------
# External configuration files
# ------------------------------------------------------------
Include node.conf
Include partition.conf
